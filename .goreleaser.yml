---
version: 2
archives:
  - id: archive
    name_template: "{{ .Binary }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
builds:
  - binary: external-dns-infoblox-webhook
    env:
      - CGO_ENABLED=0
      - GO111MODULE=on
    goarch:
      - amd64
      - arm64
    goos:
      - linux
    ldflags:
      - -X 'main.Version={{ .Tag }}'
      - -X 'main.Gitsha={{ .ShortCommit }}'
    main: ./cmd/webhook
source:
  enabled: true
signs:
  - cmd: cosign
    env:
      - COSIGN_EXPERIMENTAL=1
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --yes
      - "--output-certificate=${certificate}"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: all
    output: true
sboms:
  - artifacts: archive
  - id: source
    artifacts: source
dockers_v2:
  - id: multiarch
    images:
      - ghcr.io/absaoss/external-dns-infoblox-webhook
    tags:
      - latest
      - "{{ .Env.CI_COMMIT_SHA }}"
      - "{{ .Env.CI_COMMIT_TAG }}"
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      CI_COMMIT_TIMESTAMP: "{{ .Env.CI_COMMIT_TIMESTAMP }}"
      CI_COMMIT_SHA: "{{ .Env.CI_COMMIT_SHA }}"
      CI_COMMIT_TAG: "{{ .Env.CI_COMMIT_TAG }}"
changelog:
  disable: true
  use: github
  filters:
    exclude:
      - "^docs"
      - "^chore"
  groups:
    - title: "New Features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: "Bugfixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 10
    - title: Other Work
      order: 999
release:
  disable: false
  prerelease: auto
snapshot:
  name_template: "{{ .Tag }}-SNAPSHOT"
